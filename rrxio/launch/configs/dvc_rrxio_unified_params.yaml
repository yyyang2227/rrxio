# Unified runtime parameters for DVC-RRxIO.
# This file is loaded by rrxio_evaluate_rosbag.launch and can be swapped per run.

dvc_diag_enabled: true              # Global switch for DVC runtime diagnostic CSV output.
dvc_diag_output_dir: ""             # Output directory for dvc_diag_<run_id>.csv.
dvc_run_id: ""                      # Unique run identifier used in diagnostics and manifests.

dvc_rrxio:
  cov_mode: "alpha_r_sk"            # Radar covariance mode: base | fixed | alpha_r | alpha_r_sk | alpha_r_sk_nis_rv.
  fixed_scale: 2.0                  # Multiplicative scale used only when cov_mode=fixed.
  alpha_r:
    w_cond: 0.7                     # Weight of condition-number degradation term.
    w_inlier: 1.0                   # Weight of inlier-ratio degradation term.
    w_sparse: 0.6                   # Weight of sparse-target degradation term.
    n_targets_ref: 40.0             # Reference target count for sparsity normalization.
    k_alpha: 1.5                    # Gain from degradation score to alpha_R.
    alpha_r_max: 5.0                # Upper bound of alpha_R inflation.
    sigma_min2: 0.0001              # Minimum variance floor for SPD protection.
  s_k:
    enable: true                    # Enable directional S_k covariance shaping on top of alpha_R.
    apply_gate_enable: true         # Enable light-weight S_k apply gate (lambda3/d_r/n_targets conditions).
    tau_obs: 8.0                    # Observability eigenvalue threshold for weak-direction inflation.
    c_obs: 0.35                     # W8 frozen baseline: directional gain.
    s_max: 2.0                      # W8 frozen baseline: directional inflation cap (tested 1.8~2.2).
    eps_lambda: 0.000001            # Numerical epsilon added to U^T U before eigendecomposition.
    lambda3_apply_max: 2.0          # Apply S_k only when weakest observability eigenvalue is <= this threshold.
    d_r_apply_min: 0.70             # W8 frozen baseline: apply threshold for alpha_R degradation score.
    n_targets_apply_max: 40.0       # Apply S_k only when radar target count is <= this threshold.
    obs_trace_apply_max: 55.0       # W8 frozen baseline: observability trace gate.
    obs_aniso_apply_min: 0.0        # Apply S_k only when observability anisotropy is >= this threshold.
  contrib3:
    enable: false                   # Master switch for W9-W10 contribution chain (alpha_NIS + zeta_RV + quality gate).
    alpha_nis_enable: true          # Enable NIS-driven inflation feedback.
    eta: 0.03                       # NIS feedback gain in alpha_nis update law.
    rho: 0.98                       # Forgetting factor when radar update is skipped/rejected.
    alpha_min: 1.0                  # W10 visual-only blocked baseline: neutral lower bound, no blind covariance shrink.
    alpha_max: 8.0                  # Saturation upper bound for alpha_nis.
    zeta_enable: true               # Enable radar-visual coupling scale zeta_RV.
    theta0: 0.0                     # Balanced zeta_RV bias term around the reference degradation point.
    theta1: 0.5                     # zeta_RV weight for centered radar degradation (d_r - zeta_dr_ref).
    theta2: 0.5                     # zeta_RV weight for centered visual degradation (d_v - zeta_dv_ref).
    theta3: 0.6                     # zeta_RV cross-term weight for centered radar/visual degradation.
    zeta_dr_ref: 0.60               # Reference radar degradation used to center zeta_RV.
    zeta_dv_ref: 0.60               # Reference visual degradation used to center zeta_RV.
    zeta_min: 1.0                   # Minimum zeta_RV scale; keep >=1.0 to avoid strengthening radar in visual-only runs.
    zeta_span: 0.25                 # Symmetric zeta span around 1.0 (1±span*tanh(raw)).
    zeta_max: 1.25                  # Saturation upper bound for balanced zeta_RV.
    gate_enable: true               # Enable explicit quality gate for radar update acceptance.
    tau_r_high: 0.55                # High radar quality threshold.
    tau_r_low: 0.35                 # Low radar quality threshold for cross-modal gate.
    tau_v_low: 0.45                 # Visual low-quality threshold used in cross-modal gate.
    gate_hard_qr_min: 0.20          # Hard reject threshold for extremely low radar quality q_r.
    gate_soft_k_r: 1.0              # Radar-side gain for soft covariance penalty when not high-quality.
    gate_soft_k_v: 1.0              # Extra dual-degradation gain, multiplied by radar gap and visual degradation.
    gate_soft_scale_max: 1.4        # Max multiplicative soft penalty on covariance for current visual-only baseline.
    visual_features_ref: 25.0       # Reference valid-feature count for visual sparsity proxy.
    visual_stale_ref_s: 0.20        # Reference time gap (s) for visual staleness proxy.
    visual_w_sparse: 1.0            # Weight of visual sparsity term in d_v.
    visual_w_stale: 1.0             # Weight of visual staleness term in d_v.

  scheduler:
    mode: "event_stage2"            # Scheduler mode: legacy | event_stage1 | event_stage2.
    max_events: 2048                # Maximum queued events before overflow policy triggers.
    watermark_margin_s: 0.002       # Required IMU lead over event timestamp in seconds.
    watermark_max_wait_s: 0.200     # Max wait before watermark timeout/drop handling in seconds.
    radar_imu_window_s: 0.020       # IMU window length for radar angular-rate estimation in seconds.
    enable_diag: false              # Enable scheduler diagnostic CSV emission.
    diag_output_dir: ""             # Output directory for dvc_sched_diag_<run_id>.csv.
    imu_fast_path: true             # Enable IMU fast-path bypass of normal event queue.
    backpressure_high: -1           # High watermark for hysteresis backpressure (-1 uses auto default).
    backpressure_low: -1            # Low watermark for hysteresis backpressure (-1 uses auto default).
    backpressure_timeout_s: 5.0     # Max blocking wait per backpressure cycle in seconds.
    drain_timeout_s: 120.0          # Max wait for worker drain at bag end in seconds.

  perf_mode: "normal"               # Performance profile: normal | perf.
  perf:
    pub_decimation: 2               # Publish one message every N update cycles.
    tf_decimation: 2                # Publish TF one message every N update cycles.
    diag_flush_every_n: 32          # Flush diagnostic buffer every N rows.

# REVE / RRxIO shared conditioning threshold
max_r_cond: 1000.0                  # Maximum allowed LSQ condition number for REVE acceptance.
